name: Check TodoTree
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build a Windows installer for testing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TodoTree-Windows
          path: dist/TodoTree-Setup-*.exe
          retention-days: 7
